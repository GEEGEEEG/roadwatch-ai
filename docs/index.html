<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>RoadWatch AI — Giám sát &amp; Duy tu Mặt đường</title>
  <meta name="description" content="Ứng dụng phát hiện ổ gà, vết nứt mặt đường bằng AI (YOLO) và định vị GPS trên bản đồ GIS." />
  <meta name="theme-color" content="#0A192F" />

  <!-- iOS Web App / Safari Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RoadWatch AI" />
  <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png" />

  <!-- PWA Manifest & Favicons -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0A192F;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    #app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      border: 0;
      background: #F8FAFC;
      z-index: 1;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: linear-gradient(155deg, #0A192F 0%, #133B7A 60%, #1D4ED8 100%);
      color: #FFFFFF;
      text-align: center;
      padding: 24px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #splash img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
    }
    #splash h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    #splash p {
      font-size: 0.9rem;
      color: #CBD5E1;
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .fallback-link {
      margin-top: 10px;
      color: #93C5FD;
      font-size: 0.82rem;
      text-decoration: underline;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="./icon-512.png" alt="RoadWatch AI" />
    <h1>RoadWatch AI</h1>
    <div class="spinner" aria-hidden="true"></div>
    <p>Đang khởi động hệ thống giám sát mặt đường...</p>
    <a class="fallback-link" href="https://roadwatch-ai.streamlit.app/" rel="noopener">Mở trực tiếp nếu tải chậm</a>
  </div>

  <iframe
    id="app-frame"
    src="https://roadwatch-ai.streamlit.app/?embed=true&embed_options=show_toolbar,show_padding,light_theme"
    title="RoadWatch AI"
    allow="camera *; microphone *; geolocation *; clipboard-read *; clipboard-write *; fullscreen *"
    allowfullscreen
  ></iframe>

  <script>
    const frame = document.getElementById('app-frame');
    const splash = document.getElementById('splash');
    const hideSplash = () => splash.classList.add('hidden');
    frame.addEventListener('load', () => setTimeout(hideSplash, 400));
    setTimeout(hideSplash, 7000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
