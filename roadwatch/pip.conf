# pip.conf — thêm PyPI CPU index cho torch / torchvision
# Streamlit Community Cloud đọc file này nếu đặt đúng chỗ.
# Tuy nhiên, cách tin cậy nhất là dùng biến môi trường PIP_EXTRA_INDEX_URL
# trong Streamlit Secrets (không thể đặt trực tiếp trên Community Cloud free).
#
# GIẢI PHÁP ĐÃ KIỂM CHỨNG:
# Đặt torch và torchvision dưới dạng URL đầy đủ trong requirements.txt
# (xem README phần Deploy), hoặc dùng file packages.txt + apt + pip.conf
# trên các nền tảng khác (Railway, Render).
#
# Trên Community Cloud free, ultralytics tự kéo torch từ PyPI thông thường
# (CUDA build ~2 GB). Nếu vượt RAM 1 GB, thay bằng YOLOv8n ONNX Runtime.
[global]
extra-index-url = https://download.pytorch.org/whl/cpu
